# 16대16 승률 vs K/D 시뮬레이션 — 모든 파라미터는 이 파일 하나에 둔다 (DESIGN.md 참고).

[sim]
n_users = 2000            # 시간 초과 시 1000
max_games = 1000          # 유저당 최대 판수 (줄이지 않음)
checkpoints = [10, 30, 100, 300, 1000]
team_size = 16
lives = 3                 # 목숨 L
tickets = 100             # 티켓 T
ticket_per_death = 2      # 데스당 티켓 감소 d
capture_coef = 1.459      # 점령 계수 c: 기본 설정(q=0.05, k=0.5, σ=1)에서 킬:점령 = 50:50 (scripts/tune_capture.py)
turn_limit = 150          # 턴 상한 K
sigma = 1.0               # 교전 운 σ 기본값 (격자는 [grid].sigma)
equip_strength = 1.0      # 장비 세기 m
p_ambush = 0.2            # 매 턴 일반 교전 대신 기습이 일어날 기본 확률
ambush_gap_scale = 1.0    # 기습 확률 = p_ambush × (1 + scale × |A생존 − B생존| / 16) (0이면 인원 무관)
ambush_cap = 0.6          # 기습 확률 상한
ambush_team = "linear"    # 기습 팀: coin(동전, v1) / linear(생존 비율) / square(생존 제곱 비율)
p_steal = 0.0             # 킬 기록이 같은 팀 다른 생존자에게 갈 확률 (기본 설정 변형에서만 0.3)
comeback_deficit = 30     # 티켓 역전승 기준 (티켓 차)
outnumbered_deficit = 5   # 인원 열세 역전승 기준 (생존 인원 차)
chunk_games = 4096        # 동시에 진행하는 판 수 (성능용)

# 스타일 초기값 (k = 1 기준). 실제 값 = 올라운드 + k × (표 값 − 올라운드)
# ambush_attack: 기습하는 쪽으로 뽑힐 가중치, ambush_target: 기습당하는 쪽으로 뽑힐 가중치
[styles.assault]
engage = 1.5
p_die = 0.9
capture = 1.0
ambush_attack = 2.0
ambush_target = 0.6

[styles.allround]
engage = 1.0
p_die = 0.6
capture = 0.5
ambush_attack = 1.0
ambush_target = 1.0

[styles.sniper]
engage = 0.6
p_die = 0.3
capture = 0.1
ambush_attack = 0.3
ambush_target = 2.0

# 기본 설정(q, k, σ = 기본값)에서만 돌리는 민감도 변형. 변형마다 따로 보정한다.
# 이름의 숫자는 보정 후 실제 킬 몫(%). 기본(c = 1.459)은 약 62%.
# c는 보정 전 가중치로 킬 7:3, 3:7을 목표로 찾은 값 (scripts/tune_capture.py)
[variants.kill69]
capture_coef = 0.83

[variants.kill35]
capture_coef = 12.504

[variants.no_ambush]
p_ambush = 0.0

[variants.one_life]
lives = 1

# --- 민감도 (값은 근거 없는 임의값이라 범위 전체를 보고한다. 묶음은 [sensitivity]) ---
# 킬 스틸: 킬 기록이 같은 팀 다른 생존자에게 갈 확률
[variants.steal15]
p_steal = 0.15

[variants.steal30]
p_steal = 0.3

[variants.steal50]
p_steal = 0.5

# 이탈: 죽을 때마다 p_leave로 그 판을 나가고 남은 목숨을 버린다
# flat = 모든 유저 base, skill = 2 × base × Φ(−s)
[variants.leave_flat10]
p_leave = 0.1
leave_mode = "flat"

[variants.leave_flat20]
p_leave = 0.2
leave_mode = "flat"

[variants.leave_flat30]
p_leave = 0.3
leave_mode = "flat"

[variants.leave_skill10]
p_leave = 0.1
leave_mode = "skill"

[variants.leave_skill20]
p_leave = 0.2
leave_mode = "skill"

[variants.leave_skill30]
p_leave = 0.3
leave_mode = "skill"

# 분대: 유저 squad_frac을 2~4명 분대로 묶어 항상 같은 팀. 분대원 실력 상관 squad_corr. 협동 보너스 없음
[variants.squad30_r0]
squad_frac = 0.3
squad_corr = 0.0

[variants.squad30_r5]
squad_frac = 0.3
squad_corr = 0.5

[variants.squad60_r0]
squad_frac = 0.6
squad_corr = 0.0

[variants.squad60_r5]
squad_frac = 0.6
squad_corr = 0.5

# 협동 보너스: 분대로 참여한 판의 교전(기습 포함)에서 전투력 +b (실력·스타일 무관)
[variants.squad30_b25]
squad_frac = 0.3
squad_corr = 0.0
squad_bonus = 0.25

[variants.squad30_b50]
squad_frac = 0.3
squad_corr = 0.0
squad_bonus = 0.5

[variants.squad30_b100]
squad_frac = 0.3
squad_corr = 0.0
squad_bonus = 1.0

# 간헐적 분대: 분대가 매 판 확률 p_play로만 분대로 참여, 나머지 판은 분대원이 각자 솔로
[variants.squad30_p50_b0]
squad_frac = 0.3
squad_corr = 0.0
squad_p_play = 0.5

[variants.squad30_p50_b50]
squad_frac = 0.3
squad_corr = 0.0
squad_p_play = 0.5
squad_bonus = 0.5

# 동시 적용: 킬 스틸 0.3 + 이탈(실력 연동 0.2) + 분대(0.3, 상관 0)
[variants.combo]
p_steal = 0.3
p_leave = 0.2
leave_mode = "skill"
squad_frac = 0.3
squad_corr = 0.0

# 현실 조합: 킬 스틸 0.3 + 이탈(실력 연동 0.2) + 분대(0.3, 상관 0, p_play 0.5, b 0.5)
[variants.combo_real]
p_steal = 0.3
p_leave = 0.2
leave_mode = "skill"
squad_frac = 0.3
squad_corr = 0.0
squad_p_play = 0.5
squad_bonus = 0.5

# 기습 팀 선정 방식 (기습 확률의 인원 차 증가는 셋 다 켜 둔다). linear는 기본과 같다.
[variants.amb_coin]
ambush_team = "coin"

[variants.amb_square]
ambush_team = "square"

[variants.amb_coin_leave]
ambush_team = "coin"
p_leave = 0.2
leave_mode = "skill"

[variants.amb_square_leave]
ambush_team = "square"
p_leave = 0.2
leave_mode = "skill"

[variants.amb_coin_squad]
ambush_team = "coin"
squad_frac = 0.3
squad_corr = 0.0

[variants.amb_square_squad]
ambush_team = "square"
squad_frac = 0.3
squad_corr = 0.0

# 민감도 묶음 ("base" = 기본 설정 시드 0 실행)
[sensitivity]
steal = ["base", "steal15", "steal30", "steal50"]
leave_flat = ["base", "leave_flat10", "leave_flat20", "leave_flat30"]
leave_skill = ["base", "leave_skill10", "leave_skill20", "leave_skill30"]
squad = ["base", "squad30_r0", "squad30_r5", "squad60_r0", "squad60_r5"]
squad_bonus = ["squad30_r0", "squad30_b25", "squad30_b50", "squad30_b100"]
squad_part = ["squad30_r0", "squad30_p50_b0", "squad30_b50", "squad30_p50_b50"]
combo = ["base", "combo", "combo_real"]
ambush_team = ["amb_coin", "base", "amb_square"]
ambush_team_leave = ["amb_coin_leave", "leave_skill20", "amb_square_leave"]
ambush_team_squad = ["amb_coin_squad", "squad30_r0", "amb_square_squad"]

# 보정 결과: k별 돌격·저격 점령 가중치 (k 적용 후의 최종값). 비어 있으면 위 표 + k 규칙 사용.
[calibration]
tolerance = 0.005         # 스타일별 승률 50% ± 0.5%p
n_users = 2000
max_games = 1000
seed = 7
[calibration.capture]
