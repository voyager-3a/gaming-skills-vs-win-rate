# 16대16 승률 vs K/D 시뮬레이션 — 모든 파라미터는 이 파일 하나에 둔다 (DESIGN.md 참고).

[sim]
n_users = 2000            # 시간 초과 시 1000
max_games = 1000          # 유저당 최대 판수 (줄이지 않음)
checkpoints = [10, 30, 100, 300, 1000]
team_size = 16
lives = 3                 # 목숨 L
tickets = 100             # 티켓 T
ticket_per_death = 2      # 데스당 티켓 감소 d
capture_coef = 1.459      # 점령 계수 c: 기본 설정(q=0.05, k=0.5, σ=1)에서 킬:점령 = 50:50 (scripts/tune_capture.py)
turn_limit = 150          # 턴 상한 K
sigma = 1.0               # 교전 운 σ 기본값 (격자는 [grid].sigma)
equip_strength = 1.0      # 장비 세기 m
p_ambush = 0.2            # 매 턴 일반 교전 대신 기습이 일어날 확률
p_steal = 0.0             # 킬 기록이 같은 팀 다른 생존자에게 갈 확률 (기본 설정 변형에서만 0.3)
comeback_deficit = 30     # 티켓 역전승 기준 (티켓 차)
outnumbered_deficit = 5   # 인원 열세 역전승 기준 (생존 인원 차)
chunk_games = 4096        # 동시에 진행하는 판 수 (성능용)

# 스타일 초기값 (k = 1 기준). 실제 값 = 올라운드 + k × (표 값 − 올라운드)
# ambush_attack: 기습하는 쪽으로 뽑힐 가중치, ambush_target: 기습당하는 쪽으로 뽑힐 가중치
[styles.assault]
engage = 1.5
p_die = 0.9
capture = 1.0
ambush_attack = 2.0
ambush_target = 0.6

[styles.allround]
engage = 1.0
p_die = 0.6
capture = 0.5
ambush_attack = 1.0
ambush_target = 1.0

[styles.sniper]
engage = 0.6
p_die = 0.3
capture = 0.1
ambush_attack = 0.3
ambush_target = 2.0

# 기본 설정(q, k, σ = 기본값)에서만 돌리는 민감도 변형. 변형마다 따로 보정한다.
# 이름의 숫자는 보정 후 실제 킬 몫(%). 기본(c = 1.459)은 약 62%.
# c는 보정 전 가중치로 킬 7:3, 3:7을 목표로 찾은 값 (scripts/tune_capture.py)
[variants.kill69]
capture_coef = 0.83

[variants.kill35]
capture_coef = 12.504

[variants.no_ambush]
p_ambush = 0.0

[variants.one_life]
lives = 1

[variants.steal30]
p_steal = 0.3             # 승패가 그대로라 보정값은 base와 같다

# 보정 결과: k별 돌격·저격 점령 가중치 (k 적용 후의 최종값). 비어 있으면 위 표 + k 규칙 사용.
[calibration]
tolerance = 0.005         # 스타일별 승률 50% ± 0.5%p
n_users = 2000
max_games = 1000
seed = 7
[calibration.capture]
# "변형:k=값" = { assault = ..., sniper = ... }  (scripts/calibrate.py가 채운다)
"base:k=0.5" = { assault = 0.5601, sniper = 0.4754 }
"base:k=1.0" = { assault = 0.6285, sniper = 0.4854 }
"kill35:k=0.5" = { assault = 0.5158, sniper = 0.495 }
"kill69:k=0.5" = { assault = 0.581, sniper = 0.4597 }
"no_ambush:k=0.5" = { assault = 0.5604, sniper = 0.4786 }
"one_life:k=0.5" = { assault = 0.75, sniper = 0.3 }
"steal30:k=0.5" = { assault = 0.5601, sniper = 0.4754 }

[grid]
q = [0.0, 0.05, 0.15]
k = [0.0, 0.5, 1.0]
sigma = [1.0, 2.0, 3.0]  # 교전 운 σ 격자 축
base_q = 0.05
base_k = 0.5
base_sigma = 1.0
base_seeds = [0, 1, 2]
other_seed = 42

[pilot]
n_users = 500
max_games = 200
checkpoints = [10, 30, 100, 200]
q = 0.05
k = 0.5
sigma = [1.0, 2.0, 3.0]
seed = 0

[analysis]
bootstrap = 1000
outliers_top = 20
