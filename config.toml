[grid]
q = [0.0, 0.05, 0.15]
k = [0.0, 0.5, 1.0]
sigma = [1.0, 2.0, 3.0]  # 교전 운 σ 격자 축
base_q = 0.05
base_k = 0.5
base_sigma = 1.0
base_seeds = [0, 1, 2]
other_seed = 42

[pilot]
n_users = 500
max_games = 200
checkpoints = [10, 30, 100, 200]
q = 0.05
k = 0.5
sigma = [1.0, 2.0, 3.0]
seed = 0

[analysis]
bootstrap = 1000
outliers_top = 20
